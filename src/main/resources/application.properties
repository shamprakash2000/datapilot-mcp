server.port=${PORT:8082}
spring.application.name=datapilot-mcp

# MCP server identity — shown to hosts during tools/list handshake
spring.ai.mcp.server.name=datapilot-mcp
spring.ai.mcp.server.version=1.0.0

# Health endpoint for Render health checks and UptimeRobot
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# MCP protocol debug logging
logging.level.io.modelcontextprotocol=DEBUG
logging.level.org.springframework.ai.mcp=DEBUG

# Gemini embedding API — no chat model needed, this server is LLM-agnostic
gemini.api.key=${GEMINI_API_KEY}
gemini.embedding.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent
gemini.batch.embedding.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:batchEmbedContents

# Pinecone — raw HTTP, same index as DataPilot (index name: gemini-chat)
pinecone.api.key=${PINECONE_API_KEY}
pinecone.host=${PINECONE_HOST}

# Neon PostgreSQL — same env vars as DataPilot
spring.datasource.url=jdbc:postgresql://${NEON_HOST}/${NEON_DB}?sslmode=require
spring.datasource.hikari.data-source-properties.channelBinding=disable
spring.datasource.username=${NEON_USER}
spring.datasource.password=${NEON_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=3

# Create knowledge_documents table if it doesn't exist
spring.sql.init.schema-locations=classpath:knowledge-schema.sql
spring.sql.init.mode=always
